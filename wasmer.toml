[package]
name = "bandul/pinjam-bu-pus"
version = "0.1.7"
description = "Sistem Informasi Peminjaman Buku Perpustakaan SMK Negeri 5 Surakarta"
private = true

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
